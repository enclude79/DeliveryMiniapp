# Jenkins Pipeline - Конфигурация баз данных
# ==========================================

# Тип базы данных
DB_TYPE="sqlite3"
DB_ENGINE="sqlite"

# Development база данных
DEV_DB_NAME="delivery-dev.db"
DEV_DB_PATH="/home/enclude/automation/development/delivery-dev.db"
DEV_DB_BACKUP_PATH="/home/enclude/automation/development/backup-dev"
DEV_DB_MIGRATIONS_PATH="/home/enclude/automation/development/migrations"

# Staging база данных
STAGING_DB_NAME="delivery-staging.db"
STAGING_DB_PATH="/home/enclude/automation/staging/delivery-staging.db"
STAGING_DB_BACKUP_PATH="/home/enclude/automation/staging/backup-staging"
STAGING_DB_MIGRATIONS_PATH="/home/enclude/automation/staging/migrations"

# Production база данных
PROD_DB_NAME="delivery.db"
PROD_DB_PATH="/home/enclude/automation/production/delivery.db"
PROD_DB_BACKUP_PATH="/home/enclude/automation/production/backup"
PROD_DB_MIGRATIONS_PATH="/home/enclude/automation/production/migrations"

# Общие настройки БД
DB_BACKUP_RETENTION_DAYS=30
DB_BACKUP_COMPRESSION=true
DB_BACKUP_ENCRYPTION=false
DB_MIGRATION_TIMEOUT=300
DB_CONNECTION_TIMEOUT=30

# Настройки миграций
MIGRATIONS_TABLE="schema_migrations"
MIGRATIONS_PATH="/home/enclude/automation/migrations"
MIGRATION_PREFIX="$(date +%Y%m%d_%H%M%S)"
MIGRATION_SUFFIX=".sql"

# Команды для работы с БД
SQLITE_BIN="/usr/bin/sqlite3"
BACKUP_TOOL="sqlite3"
RESTORE_TOOL="sqlite3"

# Проверки целостности
INTEGRITY_CHECK_QUERIES=(
    "PRAGMA integrity_check;"
    "PRAGMA foreign_key_check;"
    "SELECT COUNT(*) FROM sqlite_master WHERE type='table';"
)

# Таблицы для мониторинга
MONITOR_TABLES=(
    "users"
    "orders"
    "products"
    "payments"
)

# Настройки производительности
DB_CACHE_SIZE="-64000"
DB_PAGE_SIZE="4096"
DB_MMAP_SIZE="268435456"
DB_JOURNAL_MODE="WAL"
DB_SYNCHRONOUS="NORMAL"
DB_TEMP_STORE="MEMORY"

# Безопасность
DB_FILE_PERMISSIONS="640"
DB_DIR_PERMISSIONS="750"
DB_BACKUP_PERMISSIONS="600"

# Логирование
DB_LOG_PATH="/home/enclude/automation/logs/database"
DB_LOG_LEVEL="INFO"
DB_LOG_ROTATION="daily"
DB_LOG_RETENTION="7"

# Уведомления
DB_ALERT_ON_ERROR=true
DB_ALERT_ON_BACKUP_FAILURE=true
DB_ALERT_ON_MIGRATION_FAILURE=true 