# Jenkins Pipeline - Конфигурация SystemD сервисов
# ================================================

# Development сервис
[DEV_SERVICE]
NAME="delivery-app-dev"
DESCRIPTION="Delivery App Development Environment"
EXEC_START="/usr/bin/node /home/enclude/automation/development/server.js"
WORKING_DIR="/home/enclude/automation/development"
USER="enclude"
GROUP="enclude"
ENVIRONMENT="NODE_ENV=development"
RESTART="always"
RESTART_SEC="10"
WANTED_BY="multi-user.target"
AFTER="network.target"
REQUIRES="network.target"

# Staging сервис
[STAGING_SERVICE]
NAME="delivery-app-staging"
DESCRIPTION="Delivery App Staging Environment"
EXEC_START="/usr/bin/node /home/enclude/automation/staging/server.js"
WORKING_DIR="/home/enclude/automation/staging"
USER="enclude"
GROUP="enclude"
ENVIRONMENT="NODE_ENV=staging"
RESTART="always"
RESTART_SEC="10"
WANTED_BY="multi-user.target"
AFTER="network.target"
REQUIRES="network.target"

# Production сервис
[PROD_SERVICE]
NAME="delivery-app-production"
DESCRIPTION="Delivery App Production Environment"
EXEC_START="/usr/bin/node /home/enclude/automation/production/server.js"
WORKING_DIR="/home/enclude/automation/production"
USER="enclude"
GROUP="enclude"
ENVIRONMENT="NODE_ENV=production"
RESTART="always"
RESTART_SEC="10"
WANTED_BY="multi-user.target"
AFTER="network.target"
REQUIRES="network.target"

# Dashboard сервис
[DASHBOARD_SERVICE]
NAME="delivery-automation-dashboard"
DESCRIPTION="Delivery Automation Dashboard"
EXEC_START="/usr/bin/node /home/enclude/automation/dashboard/server.js"
WORKING_DIR="/home/enclude/automation/dashboard"
USER="enclude"
GROUP="enclude"
ENVIRONMENT="NODE_ENV=production"
RESTART="always"
RESTART_SEC="10"
WANTED_BY="multi-user.target"
AFTER="network.target"
REQUIRES="network.target"

# Общие настройки для всех сервисов
[COMMON_SETTINGS]
# Логирование через journald
STANDARD_OUTPUT="journal"
STANDARD_ERROR="journal"
SYSLOG_IDENTIFIER="delivery-app"

# Автоматический restart при падении
RESTART_SEC="10"
START_LIMIT_INTERVAL="60"
START_LIMIT_BURST="3"

# Зависимости
AFTER="network.target"
WANTS="network.target"

# Безопасность
NO_NEW_PRIVILEGES="true"
PROTECT_SYSTEM="strict"
PROTECT_HOME="true"
READ_WRITE_PATHS="/home/enclude/automation"

# Ресурсы
MEMORY_MAX="512M"
CPU_QUOTA="200%"

# Таймауты
TIMEOUT_START_SEC="30"
TIMEOUT_STOP_SEC="30" 