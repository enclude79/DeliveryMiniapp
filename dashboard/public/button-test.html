            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .test-btn:hover {
            background: #0056b3;
        }
        .result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }

            currentEnv = env;
            console.log(`🌍 Среда изменена на: ${env}`);
            showNotification(`Среда изменена на ${env}`, 'success');
        }

        function getSelectedEnv() {
            return currentEnv;
        }

        function compareSchemas() {
            console.log('🔍 Сравнение схем БД...');
            showNotification('Сравнение схем БД запущено', 'info');
            
            apiCall('/api/database/compare-schemas', 'POST', { environment: currentEnv })
                .then(response => response.json())
                .then(data => {
                    showNotification('Сравнение схем БД завершено', 'success');
                })
                .catch(error => {
                    console.error('Ошибка сравнения схем:', error);
                    showNotification('Ошибка сравнения схем БД', 'error');
                });
        }

        function mergeBranches() {
            console.log('🔄 Слияние веток...');
            showNotification('Слияние веток запущено', 'info');
            
            apiCall('/api/deployment/step/2', 'POST', { environment: currentEnv })
                .then(response => response.json())

                    showNotification('Слияние веток завершено', 'success');
                })

                })
                .catch(error => {
                    console.error('Ошибка тестов:', error);
                    showNotification('Ошибка тестов', 'error');
                });
        }

        function loadLogs() {
            console.log('📋 Загрузка логов...');
            showNotification('Логи загружаются', 'info');
            
            apiCall('/api/deployment/logs')
                .then(response => response.json())

                .catch(error => {
                    console.error('Ошибка загрузки логов:', error);
                    showNotification('Ошибка загрузки логов', 'error');
                });
        }

        function logout() {
            console.log('🚪 Выход из системы...');
            localStorage.removeItem('dashboard_token');
            localStorage.removeItem('dashboard_user');
            window.location.href = '/login.html';
        }

        function showHelp(section) {
            console.log('❓ Показать справку:', section);
            showNotification('Справка показана', 'info');
        }

        function closeHelp() {
            console.log('❌ Закрыть справку');
            showNotification('Справка закрыта', 'info');
        }

        function showNotification(message, type = 'info') {
            console.log(`📢 Уведомление [${type}]: ${message}`);
            log(`📢 ${message}`, type);
        }

        function showReportModal(title, content) {
            console.log('📊 Показать модальное окно:', title);
            showNotification(`Модальное окно: ${title}`, 'info');
        }

        // Добавляем токен к API запросам
        function apiCall(url, method = 'GET', data = null) {
            const token = localStorage.getItem('dashboard_token');
            const options = {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                }
            };

            if (data) {
                options.body = JSON.stringify(data);
            }

            return fetch(url, options);
        }

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
        }

                    window.logout();
