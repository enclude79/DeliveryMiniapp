<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧪 Простой тест JavaScript</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .test-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .test-btn:hover {
            background: #0056b3;
        }
        .result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 5px;
            background: #e9ecef;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="test-card">
        <h1>🧪 Простой тест JavaScript</h1>
        <p>Эта страница проверяет, работает ли JavaScript в браузере</p>
        
        <button class="test-btn" onclick="testSimple()">Тест простой функции</button>
        <button class="test-btn" onclick="testAlert()">Тест alert()</button>
        <button class="test-btn" onclick="testConsole()">Тест console.log()</button>
        
        <div id="result" class="result">
            Результаты тестов появятся здесь...
        </div>
        
        <div style="margin-top: 30px;">
            <h3>Инструкции:</h3>
            <ol style="text-align: left;">
                <li>Нажмите кнопки выше</li>
                <li>Откройте консоль браузера (F12 → Console)</li>
                <li>Проверьте, есть ли ошибки JavaScript</li>
            </ol>
        </div>
    </div>

    <script>
        // Простая функция для теста
        function testSimple() {
            const result = document.getElementById('result');
            result.innerHTML = '<strong>✅ Простая функция работает!</strong><br>Время: ' + new Date().toLocaleTimeString();
            result.className = 'result success';
            console.log('✅ Простая функция выполнена');
        }
        
        // Тест alert
        function testAlert() {
            alert('✅ Alert работает!');
            console.log('✅ Alert выполнен');
        }
        
        // Тест console
        function testConsole() {
            console.log('✅ Console.log работает!');
            console.warn('⚠️ Console.warn работает!');
            console.error('❌ Console.error работает!');
            
            const result = document.getElementById('result');
            result.innerHTML = '<strong>✅ Console функции работают!</strong><br>Проверьте консоль браузера (F12)';
            result.className = 'result success';
        }
        
        // Проверка при загрузке страницы
        window.addEventListener('load', function() {
            console.log('✅ Страница загружена, JavaScript работает!');
            document.getElementById('result').innerHTML = '<strong>✅ Страница загружена!</strong><br>JavaScript работает корректно';
        });
        
        // Обработка ошибок
        window.addEventListener('error', function(e) {
            console.error('❌ Ошибка JavaScript:', e.error);
            document.getElementById('result').innerHTML = '<strong>❌ Ошибка JavaScript:</strong><br>' + e.error.message;
            document.getElementById('result').className = 'result error';
        });
    </script>
</body>
</html>
