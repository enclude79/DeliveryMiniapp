# Jenkins Pipeline - Конфигурация окружений
# ===========================================

# Основные пути
AUTOMATION_PATH="/home/enclude/automation"
APP_PATH="/home/enclude/delivery-app"
GITHUB_REPO="https://github.com/enclude79/DeliveryMiniapp.git"

# Development окружение
DEV_PATH="/home/enclude/automation/development"
DEV_DB_PATH="/home/enclude/automation/development/delivery-dev.db"
DEV_SERVICE="delivery-app-dev"
DEV_PORT="3001"
DEV_URL="http://localhost:3001"

# Staging окружение
STAGING_PATH="/home/enclude/automation/staging"
STAGING_DB_PATH="/home/enclude/automation/staging/delivery-staging.db"
STAGING_SERVICE="delivery-app-staging"
STAGING_PORT="3002"
STAGING_URL="http://localhost:3002"

# Production окружение
PROD_PATH="/home/enclude/automation/production"
PROD_DB_PATH="/home/enclude/automation/production/delivery.db"
PROD_SERVICE="delivery-app-production"
PROD_PORT="3000"
PROD_URL="http://localhost:3000"

# Dashboard
DASHBOARD_PATH="/home/enclude/automation/dashboard"
DASHBOARD_SERVICE="delivery-automation-dashboard"
DASHBOARD_PORT="3003"
DASHBOARD_URL="http://localhost:3003"

# Git настройки
GIT_BRANCHES=(
    "main"
    "staging"
    "develop"
    "feature/example-feature"
)

# Базы данных
DB_BACKUP_PATH="/home/enclude/automation/backup"
DB_MIGRATIONS_PATH="/home/enclude/automation/migrations"
MIGRATIONS_PATH="/home/enclude/automation/migrations"

# Логирование
LOG_PATH="/home/enclude/automation/logs"
JENKINS_LOG_PATH="/home/enclude/automation/logs/jenkins"

# Уведомления
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""
SLACK_WEBHOOK_URL=""

# Таймауты (в секундах)
BUILD_TIMEOUT=1800
DEPLOY_TIMEOUT=600
TEST_TIMEOUT=300
HEALTH_CHECK_TIMEOUT=120
DB_BACKUP_TIMEOUT=300

# Пороги для тестов
MIN_TEST_COVERAGE=80
MAX_TEST_FAILURES=0
HEALTH_CHECK_RETRIES=3

# Безопасность
JENKINS_USER="jenkins"
JENKINS_GROUP="jenkins"
SERVICE_USER="enclude"
SERVICE_GROUP="enclude"

# Флаги для отладки
DEBUG_MODE=false
VERBOSE_LOGGING=true
DRY_RUN=false 