<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Test</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .result { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 3px; }
        button { padding: 10px 15px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .error { color: red; }
        .success { color: green; }
        input { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 3px; width: 200px; }
    </style>
</head>
<body>
    <h1>🧪 Mini App Test</h1>
    
    <div class="test-section">
        <h3>1. Telegram WebApp</h3>
        <button onclick="testTelegram()">Проверить Telegram WebApp</button>
        <div id="telegram-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>2. Тест сохранения профиля</h3>
        <input type="text" id="testFullName" placeholder="Полное имя" value="Тест Тестович">
        <input type="text" id="testPhone" placeholder="Телефон" value="+7 (999) 123-45-67">
        <input type="checkbox" id="testConsent" checked> Согласие на ПД
        <br><br>
        <button onclick="testSaveProfile()">Сохранить профиль</button>
        <div id="save-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>3. Тест загрузки профиля</h3>
        <button onclick="testLoadProfile()">Загрузить профиль</button>
        <div id="load-result" class="result"></div>
    </div>

    <script>
        let tg;
        let currentUser = null;

        // Инициализация Telegram WebApp
        function initTelegram() {
            try {
                tg = window.Telegram.WebApp;
                tg.ready();
                tg.expand();
                console.log('✅ Telegram WebApp инициализирован');
                return true;
            } catch (error) {
                console.error('❌ Ошибка инициализации Telegram WebApp:', error);
                return false;
            }
        }

        // Тест Telegram WebApp
        function testTelegram() {
            const resultDiv = document.getElementById('telegram-result');
            
            if (!initTelegram()) {
                resultDiv.innerHTML = '<div class="error">❌ Telegram WebApp не инициализирован</div>';
                return;
            }

            const userInfo = {
                telegram_id: tg.initDataUnsafe?.user?.id || 'demo_user',
                first_name: tg.initDataUnsafe?.user?.first_name || 'Test',
                last_name: tg.initDataUnsafe?.user?.last_name || 'User',
                username: tg.initDataUnsafe?.user?.username || 'test_user'
            };

            resultDiv.innerHTML = `
                <div class="success">✅ Telegram WebApp работает</div>
                <pre>${JSON.stringify(userInfo, null, 2)}</pre>
            `;

            // Создаем пользователя
            createUser(userInfo);
        }

        // Создание пользователя
        async function createUser(userData) {
            try {
                const response = await fetch('/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });

                if (response.ok) {
                    currentUser = await response.json();
                    console.log('✅ Пользователь создан:', currentUser);
                } else {
                    console.error('❌ Ошибка создания пользователя:', response.status);
                }
            } catch (error) {
                console.error('❌ Ошибка создания пользователя:', error);
            }
        }

        // Тест сохранения профиля
        async function testSaveProfile() {
            const resultDiv = document.getElementById('save-result');
            
            if (!currentUser) {
                resultDiv.innerHTML = '<div class="error">❌ Пользователь не инициализирован</div>';
                return;
            }

            const fullName = document.getElementById('testFullName').value;
            const phoneNumber = document.getElementById('testPhone').value;
            const privacyConsent = document.getElementById('testConsent').checked;

            const profileData = {
                telegram_id: currentUser.telegram_id,
                first_name: currentUser.first_name,
                last_name: currentUser.last_name,
                username: currentUser.username,
                phone: currentUser.phone,
                full_name: fullName,
                phone_number: phoneNumber,
                privacy_consent: privacyConsent
            };

            try {
                resultDiv.innerHTML = 'Сохранение...';
                
                const response = await fetch(`/users/${currentUser.telegram_id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profileData)
                });

                if (response.ok) {
                    const updatedUser = await response.json();
                    currentUser = updatedUser;
                    resultDiv.innerHTML = `
                        <div class="success">✅ Профиль сохранен!</div>
                        <pre>${JSON.stringify(updatedUser, null, 2)}</pre>
                    `;
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `
                        <div class="error">❌ Ошибка сохранения: ${response.status}</div>
                        <pre>${errorText}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Ошибка: ${error.message}</div>`;
            }
        }

        // Тест загрузки профиля
        async function testLoadProfile() {
            const resultDiv = document.getElementById('load-result');
            
            if (!currentUser) {
                resultDiv.innerHTML = '<div class="error">❌ Пользователь не инициализирован</div>';
                return;
            }

            try {
                resultDiv.innerHTML = 'Загрузка...';
                
                const response = await fetch(`/users/${currentUser.telegram_id}`);
                
                if (response.ok) {
                    const userData = await response.json();
                    resultDiv.innerHTML = `
                        <div class="success">✅ Профиль загружен!</div>
                        <pre>${JSON.stringify(userData, null, 2)}</pre>
                    `;
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `
                        <div class="error">❌ Ошибка загрузки: ${response.status}</div>
                        <pre>${errorText}</pre>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Ошибка: ${error.message}</div>`;
            }
        }

        // Инициализация при загрузке
        window.addEventListener('load', () => {
            console.log('🚀 Mini App Test загружен');
            initTelegram();
        });
    </script>
</body>
</html>
